# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest
    
    strategy:
      matrix:
        destination: ['platform=iOS Simulator,OS=18.5,name=iPhone 16']

    steps:
    - uses: actions/checkout@v5
    - name: Build
      run: xcodebuild clean build -scheme CompositionalGridView -destination "${{ matrix.destination }}"
    - name: Run tests
      run: xcodebuild clean test -project CompositionalGridView.xcodeproj -scheme CompositionalGridView-Example -destination "${{ matrix.destination }}"
